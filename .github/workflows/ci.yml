name: Verify planner
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: planner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLIGHT_PROVIDER: mock
      HOTEL_PROVIDER: mock
      LLM_PROVIDER: mock
      TEST_DATABASE_URL: postgresql://planner:ci-local-only@localhost:5432/planner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python scripts/lint_copy.py
      - run: pytest -q
      - run: python eval.py
      - name: HTTP smoke
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          python scripts/smoke.py
